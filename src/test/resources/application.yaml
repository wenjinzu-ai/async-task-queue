spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always

async-task:
  executor:
    core-pool-size: 2
    max-pool-size: 2
  handler:
    call-timeout-ms: 5000
    simulate-min-ms: 30
    simulate-max-ms: 80
  heartbeat:
    interval-ms: 20